cv:
  name: Silviane Silvério
  label: Biomédica Integrativa | Naturopata e Iridologista | Pesquisadora e Escritora
  email: promotordesaudecontato@gmail.com
  location: São Paulo, Brasil
  image: "assets/img/cv/foto_perfil.jpg"
  summary: |
    Sou Biomédica Integrativa, Pesquisadora e Escritora Independente, com foco no desenvolvimento humano, existencial e na promoção do bem-estar social. Minha trajetória é marcada pela união entre a ciência e a visão holística da saúde.<br><br>Com 15 anos de experiência atuando como Naturopata e Iridologista, acompanhei a evolução do meu olhar clínico e acadêmico, o que me levou à formação em Biomedicina com foco integrativo. Ao longo desses anos, construí uma sólida experiência que transita entre a pesquisa, a escrita e a prática clínica.<br><br>Já conduzi desde atendimentos individualizados em consultório até grupos de reeducação alimentar, sempre buscando empoderar pessoas através do autoconhecimento e da saúde preventiva.<br><br>Atualmente, dedico-me à divulgação científica e educativa como escritora e criadora de conteúdo. Meu propósito é democratizar o acesso às Práticas Integrativas e Complementares (PICs), traduzindo conceitos complexos para a rotina das pessoas.
    <br><br>
